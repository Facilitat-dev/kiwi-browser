# Working product identity. Change these before the first public APK.

[product]
name = "Facilitat Browser"
short_name = "Browser"
application_id = "dev.facilitat.browser"
# Do not ship as com.kiwibrowser.browser — that ID belongs to the archived Kiwi app.

[owner]
github = "Facilitat-dev"
copyright = "Facilitat-dev"

[engine]
# Live pin (Chrome 153 stable line, 2026-09).
chromium = "153.0.8010.39"
# Afterbird last verified APK engine.
afterbird_verified = "151.0.7922.38"
kiwi_last_release = "137.0.7337.0"

[references]
# Engineering: tiny Chromium 151 delta, real APKs, MV2 on desktop-android.
afterbird = "https://github.com/danosito/afterbird"
# Product direction the owner liked (purple / extensions-first). Not our name.
relixor = "https://github.com/Relixor/Relixor"
accent = "#8000FF"

[network]
# No kiwibrowser.com, find.kiwi, or Geometry OU endpoints.
allow_kiwi_servers = false
